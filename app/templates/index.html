<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AI Policy Assistant</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <main class="container">
        <section class="hero">
            <h1>AI Policy Assistant</h1>
            <p>Ask questions about company policies and procedures.</p>
        </section>

        <section class="chat-card">
            <form id="chat-form">
                <label for="question">Your question</label>
                <textarea id="question" rows="4" placeholder="Example: What is the daily meal allowance?" required></textarea>
                <button type="submit">Ask</button>
            </form>

            <div id="loading" class="hidden">Thinking...</div>
            <div id="error" class="error hidden"></div>

            <section id="answer-section" class="hidden">
                <h2>Answer</h2>
                <p id="answer"></p>
            </section>

            <section id="citations-section" class="hidden">
                <h2>Citations</h2>
                <ul id="citations"></ul>
            </section>

            <section id="snippets-section" class="hidden">
                <h2>Source Snippets</h2>
                <div id="snippets"></div>
            </section>
        </section>
    </main>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
