services:
  - type: web
    name: ai-policy-rag
    env: python
    buildCommand: pip install -r requirements-prod.txt && python scripts/download_onnx.py && python scripts/ingest.py
    startCommand: gunicorn app.app:app --workers 1 --timeout 300 --preload -c gunicorn_config.py
    envVars:
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: meta-llama/llama-3.1-8b-instruct:free
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: PYTHON_VERSION
        value: "3.11.0"
