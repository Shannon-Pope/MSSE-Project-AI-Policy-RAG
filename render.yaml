services:
  - type: web
    name: ai-policy-rag
    env: python
    buildCommand: pip install -r requirements-prod.txt && python scripts/download_onnx.py && python scripts/ingest.py
    startCommand: gunicorn app.app:app --bind 0.0.0.0:$PORT --workers 1 --timeout 300
    envVars:
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: openai/gpt-oss-20b:free
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: PYTHON_VERSION
        value: "3.11.0"
